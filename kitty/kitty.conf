# @file: Kitty Terminal Configuration File
# @author: Daniel Yuan (daniel1yuan@gmail.com)

# Other config
scrollback_lines 5000
close_on_child_death no

# Colors: Catppuccin Mocha, vendored from https://github.com/catppuccin/kitty
include catppuccin-mocha.conf

# Tabs
tab_bar_style separator

# Key Bindings
kitty_mod super
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+L clear_terminal last_command active
map super+l next_layout

# Tab Bindings
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# Font: Requires NerdFont installation 
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
